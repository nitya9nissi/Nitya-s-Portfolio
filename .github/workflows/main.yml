name: Deploy Flutter Portfolio
on:
 push:
 branches:
 - main
YAML

 workflow_dispatch:
permissions:
 contents: read
 pages: write
 id-token: write
jobs:
 build:
 runs-on: ubuntu-latest
 steps:
 - name: Get repository
 uses: actions/checkout@v6
 - name: Setup Flutter
 uses: subosito/flutter-action@v2
 with:
 channel: stable
 cache: true
 - name: Create Flutter project
 run: flutter create --platforms=web --project-name portfolio .
 - name: Copy portfolio code
 run: cp main.dart lib/main.dart
 - name: Get dependencies
 run: flutter pub get
 - name: Build Flutter website
 run: flutter build web --release --base-href /Portfolio/
 - name: Upload website
 uses: actions/upload-pages-artifact@v4
 with:
 path: build/web
 deploy:
 needs: build
 runs-on: ubuntu-latest
 environment:
 name: github-pages
 url: ${{ steps.deployment.outputs.page_url }}
 steps:
 - name: Deploy to GitHub Pages
 id: deployment
 uses: actions/deploy-pages@v4
